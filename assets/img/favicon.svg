<!-- save as assets/img/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="MBT favicon">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>

    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="10" fill="url(#g)" filter="url(#drop)"/>

  <!-- oversized MBT monogram with thin dark outline for contrast -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="JetBrains Mono, monospace" font-weight="900" font-size="34" fill="#FFFFFF"
        stroke="#0B3A66" stroke-width="1.2" paint-order="stroke fill">
    MBT
  </text>
</svg>
